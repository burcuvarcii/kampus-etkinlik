<!DOCTYPE html>
<html lang="tr">
<head>
    <script type="module" src="js/event-form.js"></script>
    <meta charset="UTF-8">
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="css/2311012043.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <h1>Kampüs Etkinlikleri</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a> |
            <a href="etkinlikler.html">Etkinlikler</a> |
            <a href="etkinlik-ekle.html">Ekle</a>
        </nav>
    </header>
    <main>
        <h1>Etkinlik Ekle</h1>
        <p class="bilgi-notu">Yıldızlı (*) alanlar zorunludur. Bu sprintte form veri kaydetmez; sonuç aşağıda gösterilir.</p>

        <form id="etkinlik-formu" class="form-duzen">
            <p>
                <label for="ad">Etkinlik Adı *</label><br>
                <input type="text" id="ad" name="ad" placeholder="Örn. Web Tasarım Atölyesi">
                <span id="ad-hata" class="hata-mesaji"></span>
            </p>

            <p>
                <label for="kategori">Kategori *</label><br>
                <select id="kategori" name="kategori">
                    <option value="">Seçiniz</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Söyleşi">Söyleşi</option>
                </select>
                <span id="kategori-hata" class="hata-mesaji"></span>
            </p>

            <p>
                <label for="tarih">Tarih *</label><br>
                <input type="date" id="tarih" name="tarih">
                <span id="tarih-hata" class="hata-mesaji"></span>
            </p>

            <p>
                <label for="saat">Saat *</label><br>
                <input type="time" id="saat" name="saat">
                <span id="saat-hata" class="hata-mesaji"></span>
            </p>

            <p>
                <label for="yer">Yer *</label><br>
                <input type="text" id="yer" name="yer" placeholder="Örn. A Blok Konferans Salonu">
                <span id="yer-hata" class="hata-mesaji"></span>
            </p>

            <p>
                <label for="kontenjan">Kontenjan</label><br>
                <input type="number" id="kontenjan" name="kontenjan" placeholder="Örn. 50">
                <span id="kontenjan-hata" class="hata-mesaji"></span>
            </p>

            <p>
                <label for="aciklama">Açıklama</label><br>
                <textarea id="aciklama" name="aciklama" rows="4" cols="30" placeholder="Etkinlik hakkında detaylar..."></textarea>
                <span id="aciklama-hata" class="hata-mesaji"></span>
            </p>

            <p>
                <button type="submit" class="buton">Kaydet</button>
            </p>

            <div id="form-mesaj"></div>
        </form>
    </main>
    <footer>
        <p>Ad Soyad - Öğrenci No - 2026</p>
    </footer>
</body>
</html>
